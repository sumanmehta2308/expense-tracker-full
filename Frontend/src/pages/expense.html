<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Expenses — Expense Tracker</title>
  </head>
  <body style="font-size: 15.5px;">
    <header class="dash-navbar py-3">
      <div
        class="dash-container d-flex align-items-center justify-content-between flex-wrap gap-3"
      >
        <div class="d-flex align-items-center gap-3">
          <a
            href="/src/pages/dashboard.html"
            class="btn btn-outline-dark fw-semibold d-inline-flex align-items-center gap-2"
            style="font-size: 14px; padding: 7px 14px; border-radius: 8px;"
          >
            <i class="bi bi-arrow-left"></i>
            <span>Back to Dashboard</span>
          </a>
          <div class="d-flex align-items-center gap-2">
            <div class="brand-logo"><i class="bi bi-wallet2"></i></div>
            <span class="brand-name" style="font-size: 19px;">Expense History</span>
          </div>
        </div>

        <div class="d-flex align-items-center gap-3">
          <span id="userGreeting" class="user-pill d-none d-md-inline-flex" style="font-size: 14px;">
            <i class="bi bi-person-circle"></i>
            <span>Loading...</span>
          </span>
          <button id="logoutBtn" class="btn-logout" style="font-size: 14px; padding: 8px 14px;">
            <i class="bi bi-box-arrow-right"></i>
            <span>Sign out</span>
          </button>
        </div>
      </div>
    </header>

    <main class="dash-container py-4 py-md-5">
      <div
        id="alert-box"
        class="alert d-none py-2 px-3 mb-3 fw-semibold"
        style="font-size: 14.5px;"
        role="alert"
      ></div>

      <div class="dash-card overflow-hidden">
        <div class="dash-card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <h2 class="dash-card-title mb-0" style="font-size: 19px;">All Recorded Expenses</h2>
            <span class="text-muted" style="font-size: 14px;">Manage, paginate, and review your complete spending history</span>
          </div>

          <div class="d-flex align-items-center gap-2">
            <label for="rowsPerPageSelect" class="text-muted fw-semibold mb-0" style="font-size: 14px;">
              Rows per page:
            </label>
            <select id="rowsPerPageSelect" class="form-select form-select-sm" style="width: 85px; font-size: 14.5px;">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="40">40</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="expense-table" style="font-size: 15px;">
            <thead>
              <tr>
                <th>Description</th>
                <th>Category</th>
                <th>Note</th>
                <th>Date</th>
                <th class="text-end">Amount</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="expense-table-body"></tbody>
          </table>
        </div>

        <div id="emptyState" class="text-center py-5 d-none">
          <div
            class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light mb-3"
            style="width: 52px; height: 52px"
          >
            <i class="bi bi-inbox text-muted fs-4"></i>
          </div>
          <p class="fw-semibold text-dark mb-1" style="font-size: 16px">
            No expenses yet
          </p>
          <p class="text-muted mb-3" style="font-size: 14.5px;">
            Go back to Dashboard to add your first expense.
          </p>
          <a href="/src/pages/dashboard.html" class="btn btn-primary fw-semibold">
            + Add Expense
          </a>
        </div>

        <div
          id="paginationBar"
          class="d-flex justify-content-between align-items-center flex-wrap gap-2 px-4 py-3 border-top bg-light d-none"
        >
          <div id="paginationInfo" class="text-muted fw-medium" style="font-size: 14px;">
            Showing 0–0 of 0 expenses
          </div>

          <div class="d-flex align-items-center gap-2">
            <button type="button" id="firstPageBtn" class="btn btn-sm btn-outline-secondary">
              « First
            </button>
            <button type="button" id="prevPageBtn" class="btn btn-sm btn-outline-dark fw-semibold">
              ‹ Prev
            </button>
            <span id="pageIndicator" class="px-2 fw-bold text-dark" style="font-size: 14px;">
              Page 1 of 1
            </span>
            <button type="button" id="nextPageBtn" class="btn btn-sm btn-outline-dark fw-semibold">
              Next ›
            </button>
            <button type="button" id="lastPageBtn" class="btn btn-sm btn-outline-secondary">
              Last »
            </button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/scripts/expense.js"></script>
  </body>
</html>
