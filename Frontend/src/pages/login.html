<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Expense Tracker</title>
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
              <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 50px; height: 50px;">
                <i class="bi bi-box-arrow-in-right fs-4"></i>
              </div>
              <h3 class="fw-bold mb-1">Welcome Back</h3>
              <p class="text-muted small">Sign in to manage your expenses</p>
            </div>

            <div id="alert-box" class="alert d-none small" role="alert"></div>

            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label fw-medium">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
                </div>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-medium">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="bi bi-eye" id="toggleIcon"></i>
                  </button>
                </div>
                <div class="invalid-feedback">Please enter your password.</div>
              </div>

              <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
                <span id="btnText">Sign In</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
              </button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
              Don't have an account? <a href="signup.html" class="text-primary fw-semibold text-decoration-none">Create Account</a>
            </p>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/scripts/login.js"></script>
</body>
</html>
