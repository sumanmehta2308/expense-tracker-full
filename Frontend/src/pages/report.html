<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day to Day Expenses Report — Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-light" style="font-size: 15.5px;">
    <nav class="navbar bg-white border-bottom sticky-top px-3 px-md-4 py-3 shadow-sm">
      <div class="container d-flex justify-content-between align-items-center" style="max-width: 1100px;">
        <div class="d-flex align-items-center gap-3">
          <i class="bi bi-journal-check text-primary fs-3"></i>
          <div>
            <h5 class="fw-bold mb-0 text-dark">Day to Day Expenses & Income</h5>
            <small id="reportTimestamp" class="text-muted" style="font-size: 13px;"></small>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <!-- अब Download Expenses बटन सिर्फ़ इसी रिपोर्ट पेज के ऊपर दिखेगा -->
          <button id="downloadCsvBtn" class="btn-download-report" style="font-size: 14px; padding: 8px 16px;">
            <i class="bi bi-download"></i>
            <span>Download Expenses</span>
          </button>
          <button onclick="window.close()" class="btn btn-outline-secondary" style="font-size: 14px; padding: 7px 14px;">
            Close Tab
          </button>
        </div>
      </div>
    </nav>

    <main class="container py-4" style="max-width: 1100px;">
      <div class="bg-white p-4 rounded border shadow-sm mb-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 pb-3 border-bottom">
          <div>
            <span class="badge bg-warning text-dark fw-semibold px-3 py-2" style="font-size: 13.5px;">
              <i class="bi bi-patch-check-fill me-1"></i>Premium Report View
            </span>
          </div>
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-dark fw-semibold report-filter-btn active" data-filter="daily" style="font-size: 14px;">Daily</button>
            <button type="button" class="btn btn-outline-dark fw-semibold report-filter-btn" data-filter="weekly" style="font-size: 14px;">Weekly</button>
            <button type="button" class="btn btn-outline-dark fw-semibold report-filter-btn" data-filter="monthly" style="font-size: 14px;">Monthly</button>
            <button type="button" class="btn btn-outline-dark fw-semibold report-filter-btn" data-filter="all" style="font-size: 14px;">All</button>
          </div>
        </div>

        <form id="reportIncomeForm" class="row g-3 align-items-end pt-3">
          <div class="col-sm-3">
            <label class="form-label fw-semibold mb-1" style="font-size: 14px;">Add Income (₹)</label>
            <input type="number" id="reportIncomeAmount" class="form-control" placeholder="e.g. 40000" min="1" step="0.01" required />
          </div>
          <div class="col-sm-4">
            <label class="form-label fw-semibold mb-1" style="font-size: 14px;">Income Source</label>
            <input type="text" id="reportIncomeDesc" class="form-control" placeholder="e.g. Salary, Freelance" required />
          </div>
          <div class="col-sm-3">
            <label class="form-label fw-semibold mb-1" style="font-size: 14px;">Note (Optional)</label>
            <input type="text" id="reportNoteText" class="form-control" placeholder="e.g. Advance payment" />
          </div>
          <div class="col-sm-2">
            <button type="submit" class="btn btn-primary w-100 fw-semibold">+ Add Entry</button>
          </div>
        </form>
      </div>

      <div class="bg-white p-4 rounded border shadow-sm mb-4">
        <div class="table-responsive">
          <table class="table table-bordered report-table align-middle mb-0" style="font-size: 15px;">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th class="text-end text-success">Income (₹)</th>
                <th class="text-end text-danger">Expense (₹)</th>
              </tr>
            </thead>
            <tbody id="report-ledger-body">
              <tr>
                <td colspan="5" class="text-center text-muted py-4">Loading report...</td>
              </tr>
            </tbody>
            <tfoot id="report-ledger-footer"></tfoot>
          </table>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-md-7">
          <div class="bg-white p-4 rounded border shadow-sm h-100">
            <h6 class="fw-bold text-dark mb-3" style="font-size: 16.5px;">Monthly Summary</h6>
            <div class="table-responsive">
              <table class="table table-bordered report-table align-middle mb-0" style="font-size: 15px;">
                <thead>
                  <tr>
                    <th>Month</th>
                    <th class="text-end">Income (₹)</th>
                    <th class="text-end">Expense (₹)</th>
                    <th class="text-end">Savings (₹)</th>
                  </tr>
                </thead>
                <tbody id="report-monthly-body"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-md-5">
          <div class="bg-white p-4 rounded border shadow-sm h-100">
            <h6 class="fw-bold text-dark mb-3" style="font-size: 16.5px;">Notes Report</h6>
            <div class="table-responsive">
              <table class="table table-bordered report-table align-middle mb-0" style="font-size: 15px;">
                <thead>
                  <tr>
                    <th style="width: 120px;">Date</th>
                    <th>Notes</th>
                  </tr>
                </thead>
                <tbody id="report-notes-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/scripts/report.js"></script>
  </body>
</html>
